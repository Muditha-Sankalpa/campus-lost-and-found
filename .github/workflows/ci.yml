name: CI - Install & Test

# Runs on every push and every PR targeting dev or main
on:
  push:
    branches: [dev, main, feature/*]
  pull_request:
    branches: [dev, main]

jobs:
  server:
    name: Server - Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm install

      - name: Run server tests (if any exist)
        working-directory: ./server
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test --if-present -- --passWithNoTests || echo "No tests configured yet, skipping."
          else
            echo "No test script found yet, skipping."
          fi

  client:
    name: Client - Install, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm install

      - name: Run ESLint (if configured)
        working-directory: ./client
        run: npm run lint --if-present || echo "Lint step failed or not configured, continuing."

      - name: Build client (catches broken imports/syntax errors)
        working-directory: ./client
        run: npm run build --if-present

      - name: Run client tests (if any exist)
        working-directory: ./client
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test --if-present -- --passWithNoTests || echo "No tests configured yet, skipping."
          else
            echo "No test script found yet, skipping."
          fi